<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/ramen.css">
</head>
<body>
  <!-- ヘッダー -->
   
  <header class="header">

    <a href="#meat" class="nav-link">飛騨牛料理</a>

      <img 
      class="header_img" 
      src="img/111.png"
      alt="岐阜のグルメ紹介"
      >

    <a href="#noodles" class="nav-link">岐阜ラーメン</a>

  </header>
  <!-- ヘッダー終了 -->


  <!-- 各カードのパネル -->
  <main>
    <section id="main-section">
      <h1>岐阜の絶品ラーメンを紹介！</h1>
      <img src="img/岐阜の絶景グルメ 肉と麺.png" alt="">
      <h3>岐阜のおすすめラーメンをご紹介していきます<h3>
    </section>

    <p>各カードのパネルをクリックして詳細をご覧ください</p>
    <div class="card-list">
      
      <div id="card1" class="card-panel">
        <div class="card-img"></div>
        <div class="subtitle-container">
          <p class="subtitle">岐阜といえば...岐阜タンメン！</p>
        </div>

        <!-- カードの詳細を入力 -->
        <div class="card-detail hidden">
          <h1>岐阜タンメン</h1>
          <img src="img/岐阜タンメン.jpg">
          <p>岐阜タンメンは、にんにくが効いた塩ベースのスープに、白菜・キャベツ・豚バラ肉を合わせて炒めた具材をのせた、東海地方の独自のご当地ラーメンです</p>
          <img src="img/岐阜タンメンメニュー.jpg">
        </div>
      </div>
      <div id="card2" class="card-panel">
        <div class="card-detail hidden"></div>
      </div>
      <div id="card3" class="card-panel">
        <div class="card-detail hidden"></div>
      </div>
      <div id="card4" class="card-panel">
        <div class="card-detail hidden"></div>
      </div>
    </div>

    <!-- カードの詳細を表示 -->
    <div id="card-info" class="hidden">
      <div class="background"></div>
      <div class="card-container"></div>
    </div>
  </main>

  <script src="js/card.js"></script>
</body>
</html>
