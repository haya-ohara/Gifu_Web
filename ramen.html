<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/ramen.css">
</head>
<body>
  <!-- ヘッダー -->
  <header class="header">

    <a href="#meat" class="nav-link"><img class="meat" src="img/肉の紋章と肉塊の英雄.png"></a>

      <img 
      class="header_img" 
      src="img/111.png"
      alt="岐阜のグルメ紹介"
      >

    <a href="#noodles" class="nav-link"><img class="noodles" src="img/麺と神々の金色ヌードル・ロゴ.png"></a>

  </header>
  <!-- ヘッダー終了 -->


  <!-- 各カードのパネル -->
  <main>
    <section id="main-section">
      <h1>岐阜の絶品ラーメンを紹介！</h1>
      <img src="img/岐阜の絶景グルメ 肉と麺.png" alt="">
      <h3>岐阜のおすすめラーメンをご紹介していきます<h3>
    </section>

    <p>各カードのパネルをクリックして詳細をご覧ください</p>
    <div class="card-list">
      
      <div id="card1" class="card-panel">
        <div class="card-img"></div>
        <div class="subtitle-container">
          <p class="subtitle">岐阜といえば...岐阜タンメン！</p>
        </div>

        <!-- カードの詳細を入力 -->
        <div class="card-detail hidden">
          <h1>岐阜タンメン</h1>
          <img src="img/岐阜タンメン.jpg">
          <p>岐阜タンメンは、にんにくが効いた塩ベースのスープに、白菜・キャベツ・豚バラ肉を合わせて炒めた具材をのせた、東海地方の独自のご当地ラーメンです</p>
          <img src="img/岐阜タンメンメニュー.jpg">
          <h4>岐阜タンメン　岐阜本店</h4>
          <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d46202.82825387173!2d136.73251604350256!3d35.40238546423593!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6003a86c3e3d0db7%3A0x70741f235a260980!2z5bKQ6Zic44K_44Oz44Oh44OzIOWykOmYnOacrOW6lw!5e0!3m2!1sja!2sjp!4v1792385848649!5m2!1sja!2sjp" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
      </div>
      <div id="card2" class="card-panel">
        <div class="card-detail hidden"></div>
      </div>
      <div id="card3" class="card-panel">
        <div class="card-detail hidden"></div>
      </div>
      <div id="card4" class="card-panel">
        <div class="card-detail hidden"></div>
      </div>
    </div>

    <!-- カードの詳細を表示 -->
    <div id="card-info" class="hidden">
      <div class="background"></div>
      <div class="card-container"></div>
    </div>
  </main>

  <script src="js/card.js"></script>
</body>
</html>
